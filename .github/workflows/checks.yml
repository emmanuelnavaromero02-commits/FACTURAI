name: Facturador en Docker
on: [push, pull_request]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js && node --check web/visor.js && node --check web/herramientas.js
      - run: docker compose config --quiet
      - name: Construir y arrancar la aplicación
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Probar el navegador interno desde el panel
        run: docker compose exec -T facturador python - < tests/smoke_browser.py
      - name: Probar un trámite con descarga y cotejo de PDF y XML
        run: |
          docker compose cp tests facturador:/tmp/pruebas-facturador
          docker compose exec -T -e PYTHONPATH=/app facturador python /tmp/pruebas-facturador/smoke_invoice.py
      - name: Probar adjuntos y descargas manuales en Chromium
        run: docker compose exec -T -e PYTHONPATH=/app facturador python /tmp/pruebas-facturador/smoke_portal_tools.py
      - name: Recuperar el navegador y continuar sin IA
        run: docker compose exec -T -e PYTHONPATH=/app facturador python /tmp/pruebas-facturador/smoke_recovery.py
      - if: failure()
        run: docker compose logs --no-color --tail=100 facturador
      - if: always()
        run: docker compose down
