[project]
name = "facturia-api"
version = "0.1.0"
description = "Facturia API - Servicio backend multi-tenant para facturación automática de tickets CFDI 4.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "cryptography>=43.0.0",
    "redis>=5.2.0",
    "arq>=0.26.0",
    "httpx>=0.27.2",
    "email-validator>=2.3.0",
    "python-multipart>=0.0.32",
    "aioboto3>=15.5.0",
    "pillow>=12.3.0",
    "zxing-cpp>=3.1.1",
    "pillow-heif>=1.7.0",
    "playwright>=1.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: pruebas que llaman a la API real de Anthropic (se corren a mano con: uv run pytest -m live)",
]
