name: facturador-saas

services:
  facturador:
    build: .
    init: true
    shm_size: 512m
    ports:
      - '127.0.0.1:8765:8765'
    volumes:
      - expedientes:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/chromium-seccomp.json
    restart: unless-stopped

volumes:
  expedientes:
